name: Build APK Complete

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  GEMINI_API_KEY: dummy  # اگر فایل .env موجود نبود از این استفاده شود

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # چک کردن سورس
      - name: Checkout code
        uses: actions/checkout@v5

      # نصب Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # نصب Gradle مستقل از gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.3  # آخرین نسخه پایدار

      # حذف موقت خط signingConfig برای جلوگیری از خطا
      - name: Remove signingConfig
        run: |
          if [ -f "app/build.gradle.kts" ]; then
            sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
          fi

      # ساخت APK
      - name: Build Debug APK
        run: |
          echo "Using GEMINI_API_KEY=$GEMINI_API_KEY"
          gradle assembleDebug --stacktrace

      # پیدا کردن APK
      - name: Find APK
        run: find . -type f -name "*.apk"

      # آپلود Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"
